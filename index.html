<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Management System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <div id="app" class="p-6">
    <!-- Header Controls -->
    <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          🚗 Vehicle Management System
        </h1>
        <p class="text-xs text-slate-400">Live inventory and QC pipeline control</p>
      </div>
      <div class="flex gap-3">
        <button id="exportBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded text-xs font-bold transition">
          Export CSV
        </button>
        <button id="openModalBtn" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded text-xs font-bold transition shadow-lg">
          + Add Vehicle
        </button>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="flex gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Search by Stock No, Reg, Description, or VIN..." 
        class="flex-1 bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white outline-none focus:border-orange-500">
      <select id="stageFilter" class="bg-slate-800 border border-slate-700 rounded px-3 text-xs text-slate-200">
        <option value="All">All Process Statuses</option>
        <option value="1. Sourced">1. Sourced</option>
        <option value="2. Purchased">2. Purchased</option>
        <option value="3. In Transit">3. In Transit</option>
        <option value="4. Arrived">4. Arrived</option>
        <option value="5. QC">5. QC</option>
        <option value="6. Prep">6. Prep</option>
        <option value="7. Ready">7. Ready</option>
        <option value="8. Sold">8. Sold</option>
        <option value="9. Consignment">9. Consignment</option>
      </select>
    </div>

    <!-- Inventory Grid / Table View -->
    <div class="bg-slate-800 border border-slate-700 rounded-lg overflow-x-auto shadow-xl">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-900/60 text-slate-400 uppercase font-semibold border-b border-slate-700">
          <tr>
            <th class="p-3">Image</th>
            <th class="p-3">Stock / Reg</th>
            <th class="p-3">Description</th>
            <th class="p-3">Status / Location</th>
            <th class="p-3">Selling Price</th>
            <th class="p-3">QC Status</th>
            <th class="p-3">Docs (NATIS/Key)</th>
          </tr>
        </thead>
        <tbody id="vehicleTableBody" class="divide-y divide-slate-700/50">
          <!-- Live Data Injected Here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add Vehicle Modal -->
  <div id="vehicleModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white text-slate-800 rounded-lg shadow-2xl max-w-5xl w-full border border-slate-200 my-8">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center p-4 border-b border-slate-200">
        <h2 class="text-base font-bold text-slate-900">Add Vehicle</h2>
        <button id="closeModalBtn" class="text-xs border px-3 py-1 rounded bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold">
          ✕ Close
        </button>
      </div>

      <form id="vehicleForm" class="p-6 space-y-6 text-xs font-medium">
        
        <!-- Identifiers -->
        <div>
          <h3 class="text-orange-600 font-bold uppercase tracking-wide mb-3">Identifiers</h3>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-slate-600 mb-1">Stock No *</label>
              <input required type="text" name="stock_no" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Key No</label>
              <input type="text" name="key_no" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Registration *</label>
              <input required type="text" name="registration" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">VIN (17)</label>
              <input type="text" maxlength="17" name="vin" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
          </div>
        </div>

        <!-- Vehicle Information -->
        <div>
          <h3 class="text-orange-600 font-bold uppercase tracking-wide mb-3">Vehicle Information</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
            <div class="md:col-span-1">
              <label class="block text-slate-600 mb-1">Description *</label>
              <input required type="text" name="description" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Year</label>
              <input type="number" name="year" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Colour</label>
              <input type="text" name="colour" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-slate-600 mb-1">KM</label>
              <input type="number" name="km" class="w-full border rounded p-2 outline-none focus:ring-1 focus:ring-orange-500">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Location</label>
              <select name="location" class="w-full border rounded p-2 bg-white">
                <option value="—">—</option>
                <option value="SRT">SRT</option>
                <option value="DOL">DOL</option>
                <option value="PACE">PACE</option>
                <option value="WBC">WBC</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Process Status</label>
              <select name="process_status" class="w-full border rounded p-2 bg-white">
                <option value="1. Sourced">1. Sourced</option>
                <option value="2. Purchased">2. Purchased</option>
                <option value="3. In Transit">3. In Transit</option>
                <option value="4. Arrived">4. Arrived</option>
                <option value="5. QC">5. QC</option>
                <option value="6. Prep">6. Prep</option>
                <option value="7. Ready" selected>7. Ready</option>
                <option value="8. Sold">8. Sold</option>
                <option value="9. Consignment">9. Consignment</option>
                <option value="—">—</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Retail/DOL</label>
              <select name="retail_dol" class="w-full border rounded p-2 bg-white">
                <option value="Retail" selected>Retail</option>
                <option value="DOL">DOL</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Pricing & Status -->
        <div>
          <h3 class="text-orange-600 font-bold uppercase tracking-wide mb-3">Pricing & Status</h3>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-3">
            <div>
              <label class="block text-slate-600 mb-1">Supplier</label>
              <input type="text" name="supplier" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Buying</label>
              <input type="number" step="0.01" name="buying_price" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Selling</label>
              <input type="number" step="0.01" name="selling_price" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Advertising</label>
              <select name="advertising" class="w-full border rounded p-2 bg-white">
                <option value="LIVE" selected>LIVE</option>
                <option value="Consignment">Consignment</option>
                <option value="NO ADV">NO ADV</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-slate-600 mb-1">AutoTrader</label>
              <input type="number" step="0.01" name="autotrader_price" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Cars.co.za</label>
              <input type="number" step="0.01" name="cars_co_za_price" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">PCS Website</label>
              <input type="number" step="0.01" name="pcs_website_price" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Outstanding</label>
              <select name="outstanding_status" class="w-full border rounded p-2 bg-white">
                <option value="CHECK" selected>CHECK</option>
                <option value="CLEAR">CLEAR</option>
              </select>
            </div>
          </div>
        </div>

        <!-- QC & Docs + Image -->
        <div>
          <h3 class="text-orange-600 font-bold uppercase tracking-wide mb-3">QC & Docs + Image</h3>
          
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-3">
            <div>
              <label class="block text-slate-600 mb-1">QC Status</label>
              <select name="qc_status" class="w-full border rounded p-2 bg-white">
                <option value="Pending" selected>Pending</option>
                <option value="Passed">Passed</option>
                <option value="Attention Required">Attention Required</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Spare Key</label>
              <select name="spare_key" class="w-full border rounded p-2 bg-white">
                <option value="—" selected>—</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Spare Key Loc</label>
              <input type="text" name="spare_key_loc" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Service Book</label>
              <select name="service_book" class="w-full border rounded p-2 bg-white">
                <option value="—" selected>—</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-3">
            <div>
              <label class="block text-slate-600 mb-1">Service Loc</label>
              <input type="text" name="service_loc" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">NATIS</label>
              <select name="natis" class="w-full border rounded p-2 bg-white">
                <option value="—" selected>—</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">NATIS Loc</label>
              <input type="text" name="natis_loc" class="w-full border rounded p-2 outline-none">
            </div>
            <div>
              <label class="block text-slate-600 mb-1">License Disc</label>
              <select name="license_disc" class="w-full border rounded p-2 bg-white">
                <option value="—" selected>—</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
            <div>
              <label class="block text-slate-600 mb-1">Mechanical</label>
              <select name="mechanical" class="w-full border rounded p-2 bg-white">
                <option value="Pending" selected>Pending</option>
                <option value="Good">Good</option>
                <option value="Attention">Attention</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Bodywork</label>
              <select name="bodywork" class="w-full border rounded p-2 bg-white">
                <option value="Pending" selected>Pending</option>
                <option value="Good">Good</option>
                <option value="Attention">Attention</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">Condition</label>
              <select name="condition" class="w-full border rounded p-2 bg-white">
                <option value="—" selected>—</option>
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-slate-600 mb-1">Notes</label>
            <textarea name="notes" rows="3" class="w-full border rounded p-2 outline-none"></textarea>
          </div>

          <!-- Image Upload Box -->
          <div class="border border-slate-200 rounded p-4 bg-slate-50 flex items-center gap-4">
            <div id="imagePreview" class="w-24 h-16 border-2 border-dashed border-orange-300 rounded flex items-center justify-center bg-white overflow-hidden text-[10px] text-slate-400">
              No image
            </div>
            <div class="flex items-center gap-2">
              <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded font-bold text-xs shadow-sm">
                Choose Image
                <input type="file" id="imageInput" accept="image/*" class="hidden">
              </label>
              <button type="button" id="clearImageBtn" class="border px-3 py-1.5 rounded bg-white hover:bg-slate-100 text-slate-600 text-xs font-bold">
                Clear
              </button>
            </div>
            <span class="text-[10px] text-slate-400">Auto compress to 800px JPEG 0.7 → local base64</span>
          </div>
        </div>

        <!-- Footer -->
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold">
            Cancel
          </button>
          <button type="submit" id="saveVehicleBtn" class="px-5 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded font-bold shadow-md">
            Save Vehicle → Local
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // Config & Supabase Initialization
    const SUPABASE_URL = 'https://sxpfclmtczrfawlgjvgs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cGZjbG10Y3pyZmF3bGdqdmdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTQyMjQsImV4cCI6MjEwMTMzMDIyNH0.a3wiYasSifHOU5nx0pVAM4K4H_zlkKY0eRXK-jvNY1E';
    const supabaseClient = supabase.createClient(https://sxpfclmtczrfawlgjvgs.supabase.co, sb_publishable_BtXBA8DQJ4Mv11td_O3bWQ_cBPlkLqy);

    let vehiclesData = [];
    let imageBase64String = '';

    // DOM Elements
    const vehicleModal = document.getElementById('vehicleModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const vehicleForm = document.getElementById('vehicleForm');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const clearImageBtn = document.getElementById('clearImageBtn');
    const vehicleTableBody = document.getElementById('vehicleTableBody');
    const searchInput = document.getElementById('searchInput');
    const stageFilter = document.getElementById('stageFilter');
    const exportBtn = document.getElementById('exportBtn');

    // Toggle Modal
    const toggleModal = (show) => {
      vehicleModal.style.display = show ? 'flex' : 'none';
      if (!show) {
        vehicleForm.reset();
        imageBase64String = '';
        imagePreview.innerHTML = 'No image';
      }
    };

    openModalBtn.addEventListener('click', () => toggleModal(true));
    closeModalBtn.addEventListener('click', () => toggleModal(false));
    cancelModalBtn.addEventListener('click', () => toggleModal(false));

    // Handle Image Compression to Base64
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const scaleFactor = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleFactor;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          imageBase64String = canvas.toDataURL('image/jpeg', 0.7);
          imagePreview.innerHTML = `<img src="${imageBase64String}" class="object-cover w-full h-full" />`;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    clearImageBtn.addEventListener('click', () => {
      imageBase64String = '';
      imageInput.value = '';
      imagePreview.innerHTML = 'No image';
    });

    // Fetch Vehicles from Supabase
    const fetchVehicles = async () => {
      const { data, error } = await supabaseClient
        .from('vehicles')
        .select('*')
        .order('created_at', { ascending: false });

      if (!error && data) {
        vehiclesData = data;
        renderVehicles();
      }
    };

    // Render Table
    const renderVehicles = () => {
      const search = searchInput.value.toLowerCase();
      const stage = stageFilter.value;

      const filtered = vehiclesData.filter(v => {
        const matchesSearch = `${v.stock_no}${v.registration} ${v.description}${v.vin}`.toLowerCase().includes(search);
        const matchesStage = stage === 'All' || v.process_status === stage;
        return matchesSearch && matchesStage;
      });

      vehicleTableBody.innerHTML = filtered.map(v => `
        <tr class="hover:bg-slate-800/80 transition border-b border-slate-800">
          <td class="p-3">
            ${v.image_base64 
              ? `<img src="${v.image_base64}" class="w-12 h-8 object-cover rounded border border-slate-700" />` 
              : `<div class="w-12 h-8 bg-slate-900 rounded border border-slate-700 flex items-center justify-center text-[9px] text-slate-500">No Img</div>`
            }
          </td>
          <td class="p-3">
            <div class="font-bold text-white">${v.stock_no}</div>
            <div class="text-[10px] text-slate-400 font-mono">${v.registration}</div>
          </td>
          <td class="p-3 font-medium text-slate-200">${v.description}</td>
          <td class="p-3">
            <span class="bg-slate-700/60 text-slate-300 px-2 py-0.5 rounded text-[10px] border border-slate-600">${v.process_status}</span>
            <span class="text-slate-400 text-[10px] ml-1">(${v.location})</span>
          </td>
          <td class="p-3 text-orange-400 font-bold">R ${v.selling_price ? Number(v.selling_price).toLocaleString() : '0'}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${               v.qc_status === 'Passed' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :               v.qc_status === 'Attention Required' ? 'bg-rose-950 text-rose-400 border border-rose-800' :               'bg-amber-950 text-amber-400 border border-amber-800'             }">${v.qc_status}</span>
          </td>
          <td class="p-3 text-[10px] text-slate-400">
            NATIS: <span class="text-white">${v.natis}</span> \vert{} Key: <span class="text-white">${v.spare_key}</span>
          </td>
        </tr>
      `).join('');
    };

    // Form Submission
    vehicleForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(vehicleForm);
      const payload = Object.fromEntries(formData.entries());

      payload.image_base64 = imageBase64String;
      payload.year = payload.year ? parseInt(payload.year) : null;
      payload.km = payload.km ? parseInt(payload.km) : null;
      payload.buying_price = payload.buying_price ? parseFloat(payload.buying_price) : null;
      payload.selling_price = payload.selling_price ? parseFloat(payload.selling_price) : null;
      payload.autotrader_price = payload.autotrader_price ? parseFloat(payload.autotrader_price) : null;
      payload.cars_co_za_price = payload.cars_co_za_price ? parseFloat(payload.cars_co_za_price) : null;
      payload.pcs_website_price = payload.pcs_website_price ? parseFloat(payload.pcs_website_price) : null;

      const { error } = await supabaseClient.from('vehicles').insert([payload]);

      if (!error) {
        toggleModal(false);
        fetchVehicles();
      } else {
        alert('Failed to save record: ' + error.message);
      }
    });

    // CSV Export
    exportBtn.addEventListener('click', () => {
      const headers = 'Stock No,Registration,VIN,Description,Year,KM,Location,Status,Selling Price\n';
      const rows = vehiclesData.map(v => 
        `"${v.stock_no}","${v.registration}","${v.vin}","${v.description}",${v.year},${v.km},"${v.location}","${v.process_status}",${v.selling_price}`
      ).join('\n');
      
      const blob = new Blob([headers + rows], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vehicles_export_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    });

    // Filtering Event Listeners
    searchInput.addEventListener('input', renderVehicles);
    stageFilter.addEventListener('change', renderVehicles);

    // Initial Load & Realtime Subscription
    fetchVehicles();
    supabaseClient
      .channel('public:vehicles')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'vehicles' }, fetchVehicles)
      .subscribe();
  </script>
</body>
</html>
